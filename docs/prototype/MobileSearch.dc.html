<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trait Atlas — Mobile smart search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0e1014}
a{color:#8ab4ff}a:hover{color:#b8d0ff}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
#msq::placeholder{color:#6b7480}
.m-op{color:#f3c969;font-weight:500}
.m-par{color:#8a94a1}
.m-field{color:#8ab4ff}
.m-val{color:#f1f3f5}
.m-neg{color:#ff9b87}
.m-phr{color:#a7e3c4}
.m-txt{color:#f1f3f5}
.m-err{text-decoration:underline wavy #ff6b5b;text-underline-offset:5px;text-decoration-skip-ink:none}
.row{display:grid;grid-template-columns:76px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:54px;padding:6px 16px;border:0;border-bottom:1px solid #1a1f26;background:transparent;text-align:left}
.row:active{background:#1d2b3e}
.kb{justify-self:start;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.03em;text-transform:uppercase;padding:2px 6px;border-radius:4px;border:1px solid #2e3741;color:#a0a8b3}
.k-field{color:#8ab4ff;border-color:#2c4566}
.k-op{color:#f3c969;border-color:#5a4a22}
.k-debuff{color:#ff9b87;border-color:#5e3029}
.k-buff{color:#74dbb0;border-color:#24533f}
.k-mech{color:#a9c1ff;border-color:#2c3b66}
.k-trig{color:#f3c969;border-color:#5a4a22}
.mt{color:#f1f3f5;font-weight:600}
.acc{flex:none;min-width:44px;height:44px;padding:0 12px;border-radius:8px;border:1px solid #2e3741;background:#1a1f26;font-family:'JetBrains Mono',monospace;font-size:14px;color:#e4e7eb}
.acc.op{color:#f3c969}
.acc.fd{color:#8ab4ff}
.fh{margin:0;padding:14px 16px 6px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#8a94a1}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0e1014; color: #e4e7eb; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column">

<div style="flex: none; display: flex; align-items: center; gap: 6px; padding: 10px 8px 10px 4px; border-bottom: 1px solid #1f252d">
<a href="Mobile.dc.html" aria-label="Back to results" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #c8ced6"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="flex: 1; min-width: 0; display: flex; align-items: center; height: 46px; padding: 0 10px; border-radius: 9px; border: 1px solid {{barBorder}}; background: #12161b">
<label for="msq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search traits</label>
<div style="position: relative; flex: 1; min-width: 0; height: 100%">
<div aria-hidden="true" class="mono" style="position: absolute; inset: 0; display: flex; align-items: center; white-space: pre; overflow: hidden; font-size: 15px; pointer-events: none"><span><sc-for list="{{mirror}}" as="m" hint-placeholder-count="3"><span class="{{m.cls}}">{{m.text}}</span></sc-for></span></div>
<input id="msq" class="mono" role="combobox" aria-expanded="true" aria-controls="ms-list" aria-autocomplete="list" aria-invalid="{{hasErrors}}" value="{{q}}" onChange="{{onInput}}" onSelect="{{onSel}}" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" placeholder="Search traits" style="position: relative; width: 100%; height: 100%; padding: 0; border: 0; outline: 0; background: transparent; font-size: 15px; color: transparent; caret-color: #f1f3f5">
</div>
<sc-if value="{{hasQ}}" hint-placeholder-val="{{ true }}"><button onClick="{{clearQ}}" aria-label="Clear search" style="display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 44px; margin-right: -6px; border: 0; background: transparent; color: #a0a8b3"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></sc-if>
</div>
</div>

<sc-if value="{{hasDiag}}" hint-placeholder-val="{{ true }}">
<div style="flex: none; display: flex; align-items: center; gap: 10px; margin: 10px 12px 0; padding: 8px 8px 8px 12px; border-radius: 8px; background: {{diagBg}}; border: 1px solid {{diagBorder}}; color: {{diagColor}}; font-size: 13px">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true" style="flex: none"><path d="M12 4 2.5 20h19z"></path><path d="M12 10v4M12 17v.5"></path></svg>
<span style="flex: 1">{{diagMsg}}</span>
<sc-if value="{{diagHasFix}}" hint-placeholder-val="{{ true }}"><button onClick="{{diagFix}}" style="flex: none; height: 36px; padding: 0 12px; border-radius: 6px; border: 1px solid currentColor; background: transparent; color: inherit; font-size: 13px">{{diagFixLabel}}</button></sc-if>
</div>
</sc-if>

<div style="flex: none; display: flex; gap: 8px; padding: 10px 16px 4px; font-size: 12.5px; color: #a0a8b3"><span style="flex: none; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #8a94a1; padding-top: 1px">Reads as</span><span style="color: #dfe3e8">{{reads}}</span></div>

<div style="flex: 1; min-height: 0; overflow-y: auto">
<sc-if value="{{showHistory}}" hint-placeholder-val="{{ false }}"><h2 class="fh">Recent and saved</h2></sc-if>
<sc-if value="{{showSuggest}}" hint-placeholder-val="{{ true }}"><h2 class="fh">Suggestions</h2></sc-if>
<ul id="ms-list" role="listbox" aria-label="Suggestions" style="margin: 0; padding: 0; list-style: none">
<sc-for list="{{items}}" as="it" hint-placeholder-count="6"><li role="option" aria-selected="false"><button class="row" onClick="{{it.pick}}"><span class="{{it.kcls}}">{{it.kindLabel}}</span><span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span class="mono" style="font-size: 14px; color: #c8ced6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.a}}<span class="mt">{{it.b}}</span>{{it.c}}</span><span style="font-size: 12px; color: #8a94a1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.detail}}</span></span><span class="mono" style="font-size: 11.5px; color: #8a94a1">{{it.countText}}</span></button></li></sc-for>
</ul>
</div>

<div style="flex: none; padding: 8px 12px; border-top: 1px solid #1f252d; background: #0b0d10; display: flex; flex-direction: column; gap: 8px">
<a href="Mobile.dc.html" aria-live="polite" style="display: flex; align-items: center; justify-content: center; height: 46px; border-radius: 10px; background: #8ab4ff; color: #0b1220; font-size: 15px; font-weight: 600; text-decoration: none">Show {{count}} traits</a>
<div role="toolbar" aria-label="Insert query syntax" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -12px; padding: 0 12px 2px">
<sc-for list="{{acc}}" as="b" hint-placeholder-count="8"><button class="{{b.cls}}" onClick="{{b.go}}" aria-label="{{b.aria}}">{{b.label}}</button></sc-for>
</div>
</div>
</div>
</x-dc>

    else if (F === 'K') ALLKW.forEach(function(k){ if (k.key.indexOf(fv) >= 0) add(fn + ':' + qt(k.key), k.kind, neg + fn + ':' + qt(k.key), k.label, fv); });
    else if (F === 'cls') CLASSES.forEach(function(c){ if (c.toLowerCase().indexOf(fv) >= 0) add(fn + ':' + qt(c.toLowerCase()), 'class', neg + fn + ':' + qt(c.toLowerCase()), 'class', fv); });
    else if (F === 'fam') FAMILIES.forEach(function(c){ if (c.toLowerCase().indexOf(fv) >= 0) add(fn + ':' + qt(c.toLowerCase()), 'family', neg + fn + ':' + qt(c.toLowerCase()), 'family', fv); });
    else if (F === 'trait') ROWS.forEach(function(r){ if (r.trait.toLowerCase().indexOf(fv) >= 0) add(fn + ':' + qt(r.trait.toLowerCase()), 'trait', neg + fn + ':' + qt(r.trait.toLowerCase()), r.cre, fv); });
    else if (F === 'cre') ROWS.forEach(function(r){ if (!r.mastery && r.cre.toLowerCase().indexOf(fv) >= 0) add(fn + ':' + qt(r.cre.toLowerCase()), 'creature', neg + fn + ':' + qt(r.cre.toLowerCase()), r.trait, fv); });
    else if (F === 'M' || F === 'S') ['yes','no'].forEach(function(v){ if (v.indexOf(fv) === 0) add(fn + ':' + v, 'value', neg + fn + ':' + v, F === 'M' ? (v === 'yes' ? 'artifact-eligible' : 'no material') : (v === 'yes' ? 'stacks' : 'does not stack'), fv); });
  } else if (!p) {
    if (prev && prev !== '(' && !isOpTok(prev)) { add('OR','op','OR','either side'); add('AND','op','AND','both sides (also implicit)'); add('NOT','op','NOT','exclude the next term'); }
    FIELD_NAMES.forEach(function(f){ add(f + ':', 'field', f + ':', FIELD_HELP[f], '', false); });
  } else {
    FIELD_NAMES.forEach(function(f){ if (f.indexOf(lp) === 0) add(f + ':', 'field', neg + f + ':', FIELD_HELP[f], lp, false); });
    ALLKW.forEach(function(k){
      if (k.key.indexOf(lp) < 0) return;
      if (k.kind === 'debuff' || k.kind === 'buff') { add('applies:' + k.key, k.kind, neg + 'applies:' + k.key, 'applies ' + k.label, lp); add('uses:' + k.key, k.kind, neg + 'uses:' + k.key, 'relies on ' + k.label, lp); }
      else if (k.kind === 'trig') add('"' + k.key + '"', 'trig', neg + '"' + k.key + '"', 'trigger · ' + k.label, lp);
      else add('kw:' + qt(k.key), 'mech', neg + 'kw:' + qt(k.key), k.label, lp);
    });
    ROWS.forEach(function(r){ if (r.trait.toLowerCase().indexOf(lp) >= 0) add('trait:' + qt(r.trait.toLowerCase()), 'trait', neg + 'trait:' + qt(r.trait.toLowerCase()), r.cre, lp); });
    FAMILIES.forEach(function(f){ if (f.toLowerCase().indexOf(lp) >= 0) add('family:' + qt(f.toLowerCase()), 'family', neg + 'family:' + qt(f.toLowerCase()), 'family', lp); });
    add(p, 'text', neg + p, 'match anywhere in the text', lp);
  }
  return {cur:cur, raw:raw, items:items.slice(0, 9)};
}

function lint(q){
  var toks = tokPos(q), out = [], depth = 0;
  toks.forEach(function(t, i){
    var tt = t.t, pv = toks[i-1], nx = toks[i+1];
    if (tt === '(') { depth++; return; }
    if (tt === ')') { if (depth === 0) out.push({at:t, msg:'Unmatched “)”', fixLabel:'Remove it', fix:tidy(rep(q,t,''))}); else depth--; return; }
    if (/^(AND|OR|&|\|)$/i.test(tt)) { if (!pv || pv.t === '(' || isOpTok(pv.t) || !nx || nx.t === ')') out.push({at:t, msg:'“' + tt.toUpperCase() + '” needs a term on both sides', fixLabel:'Remove ' + tt.toUpperCase(), fix:tidy(rep(q,t,''))}); return; }
    if (/^NOT$/i.test(tt)) { if (!nx || nx.t === ')' || isOpTok(nx.t)) out.push({at:t, msg:'“NOT” needs a term after it', fixLabel:'Remove NOT', fix:tidy(rep(q,t,''))}); return; }
    var neg = tt[0] === '-' ? '-' : '', body = neg ? tt.slice(1) : tt;
    if ((body.match(/"/g) || []).length === 1) { out.push({at:t, msg:'Unclosed quote', fixLabel:'Close the phrase', fix:rep(q,t,tt + '"')}); return; }
    var m = /^([A-Za-z]+):(.*)$/.exec(body);
    if (m) {
      var fn = m[1].toLowerCase(), v = m[2].replace(/"/g,'').toLowerCase(), F = FIELDS[fn], c;
      if (!F) { c = closest(fn, FIELD_NAMES); out.push({at:t, msg:'Unknown field “' + m[1] + ':”' + (c ? '. Did you mean “' + c + ':”?' : ''), fixLabel: c ? 'Use ' + c + ':' : '', fix: c ? rep(q,t,neg + c + ':' + m[2]) : null}); return; }
      if (!v) { out.push({at:t, msg:'“' + fn + ':” has no value yet', fixLabel:'', fix:null, sev:'warn'}); return; }
      if (F === 'A' || F === 'U') {
        if (ROLEKW.some(function(k){ return k.key.indexOf(v) === 0; })) return;
        var mk = ALLKW.filter(function(k){ return k.key.indexOf(v) === 0; })[0];
        if (mk) { out.push({at:t, sev:'warn', msg:mk.label + ' has no applies/uses role. Search it as a keyword instead.', fixLabel:'Use kw:' + qt(mk.key), fix:rep(q,t,neg + 'kw:' + qt(mk.key))}); return; }
        c = closest(v, DEBUFFS.concat(BUFFS));
        out.push({at:t, msg:'No buff or debuff called “' + v + '”' + (c ? '. Did you mean ' + c + '?' : ''), fixLabel: c ? 'Use ' + fn + ':' + c.toLowerCase() : '', fix: c ? rep(q,t,neg + fn + ':' + c.toLowerCase()) : null}); return;
      }
      if (F === 'K') { if (ALLKW.some(function(k){ return k.key.indexOf(v) === 0; })) return; c = closest(v, ALLKW.map(function(k){ return k.key; })); out.push({at:t, msg:'No keyword “' + v + '”' + (c ? '. Did you mean ' + c + '?' : ''), fixLabel: c ? 'Use kw:' + qt(c) : '', fix: c ? rep(q,t,neg + 'kw:' + qt(c)) : null}); return; }
      if (F === 'M' || F === 'S') { if (['yes','no','none'].indexOf(v) < 0) out.push({at:t, msg:'“' + fn + ':” takes yes or no', fixLabel:'Use ' + fn + ':' + (F === 'M' ? 'yes' : 'no'), fix:rep(q,t,neg + fn + ':' + (F === 'M' ? 'yes' : 'no'))}); return; }
      if (F === 'cls') { if (CLASSES.some(function(x){ return x.toLowerCase().indexOf(v) >= 0; })) return; c = closest(v, CLASSES); out.push({at:t, msg:'No class “' + v + '”' + (c ? '. Did you mean ' + c + '?' : ''), fixLabel: c ? 'Use class:' + qt(c.toLowerCase()) : '', fix: c ? rep(q,t,neg + fn + ':' + qt(c.toLowerCase())) : null}); return; }
      return;
    }
    var lv = body.replace(/"/g,'').toLowerCase();
    if (lv.length > 1 && !ROWS.some(function(r){ return r.text.indexOf(lv) >= 0; })) { var c5 = closest(lv, VOCAB); out.push({at:t, sev:'warn', msg:'“' + lv + '” appears in no trait' + (c5 ? '. Did you mean “' + c5 + '”?' : ''), fixLabel: c5 ? 'Use ' + c5 : '', fix: c5 ? rep(q,t,neg + qt(c5)) : null}); }
  });
  if (depth > 0) out.push({at:null, msg:(depth === 1 ? 'One' : depth) + ' unclosed “(”', fixLabel:'Close it', fix:q.replace(/\s+$/,'') + new Array(depth + 1).join(')')});
  return out;
}

function termText(n){
  var v = n.v;
  if (n.f === null) return 'mentions “' + v + '”';
  if (n.f === 'A') return 'applies ' + cap(v);
  if (n.f === 'U') return 'relies on ' + cap(v);
  if (n.f === 'K') return 'has keyword “' + v + '”';
  if (n.f === 'cls') return 'class is ' + cap(v);
  if (n.f === 'fam') return 'family is ' + cap(v);
  if (n.f === 'cre') return 'creature is “' + v + '”';
  if (n.f === 'trait') return 'trait is “' + v + '”';
  if (n.f === 'desc') return 'text has “' + v + '”';
  if (n.f === 'M') return (v === 'no' || v === 'none') ? 'has no material' : 'is artifact-eligible';
  if (n.f === 'S') return v === 'no' ? 'does not stack' : 'stacks';
  return v;
}
function explain(n, parent){
  if (!n) return 'every trait';
  if (n.op === 'term') return termText(n);
  if (n.op === 'not') return 'NOT ' + explain(n.a, 'not');
  var s = n.op === 'and' ? explain(n.a, 'and') + ' AND ' + explain(n.b, 'and') : explain(n.a, 'or') + ' OR ' + explain(n.b, 'or');
  return (parent && parent !== n.op) ? '(' + s + ')' : s;
}

var KIND_LABEL = {field:'field', op:'operator', debuff:'debuff', buff:'buff', mech:'mechanic', trig:'trigger', trait:'trait', creature:'creature', family:'family', 'class':'class', value:'value', text:'text', recent:'recent', saved:'saved'};
var START_Q = '(weak OR uses:sn';

class Component extends DCLogic {
  state = {
    q: START_Q, caret: START_Q.length,
    recent: ['(vulnerable OR weak) -stack:no', 'applies:snared', 'family:clutcher'],
    saved: [{name:'Vulnerable payoffs, artifact-ready', q:'uses:vulnerable mat:yes'}, {name:'Start-of-battle shields', q:'"start of battle" kw:barrier'}]
  };

  renderVals() {
    var self = this, st = this.state, q = st.q, caret = Math.min(st.caret, q.length);
    var set = function(p){ self.setState(p); };
    var sg = suggest(q, caret);
    var showHistory = q.trim() === '';
    var items = showHistory
      ? st.recent.map(function(r){ return {label:r, kind:'recent', insert:r, detail:'', match:'', whole:true, complete:true}; }).concat(st.saved.map(function(s){ return {label:s.q, kind:'saved', insert:s.q, detail:s.name, match:'', whole:true, complete:true}; }))
      : sg.items;

    function nextQ(it){
      if (it.whole) return {q:it.insert, caret:it.insert.length};
      var cur = sg.cur, after = q.slice(cur.end).replace(/^\s+/,''), sep = it.complete ? ' ' : '';
      var nq = q.slice(0, cur.start) + it.insert + sep + after;
      return {q:nq, caret:cur.start + it.insert.length + sep.length};
    }
    var itemsV = items.map(function(it){
      var low = it.label.toLowerCase(), mi = it.match ? low.indexOf(it.match) : -1;
      var cnt = (it.complete && it.kind !== 'op') ? countFor(nextQ(it).q) : null;
      return {
        a: mi >= 0 ? it.label.slice(0, mi) : it.label, b: mi >= 0 ? it.label.slice(mi, mi + it.match.length) : '', c: mi >= 0 ? it.label.slice(mi + it.match.length) : '',
        detail:it.detail, kindLabel:KIND_LABEL[it.kind] || it.kind, kcls:'kb k-' + it.kind,
        countText: cnt === null ? '' : String(cnt),
        pick:function(){ var n = nextQ(it); set({q:n.q, caret:n.caret}); }
      };
    });

    var diagsRaw = lint(q), errAt = {};
    diagsRaw.forEach(function(d){ if (d.at) errAt[d.at.start] = 1; });
    var d0 = diagsRaw[0], warn = d0 && d0.sev === 'warn';
    var nErr = diagsRaw.filter(function(d){ return d.sev !== 'warn'; }).length;

    var toks = tokPos(q), mirror = [], pos = 0;
    toks.forEach(function(t){
      if (t.start > pos) mirror.push({text:q.slice(pos, t.start), cls:''});
      var e = errAt[t.start] ? ' m-err' : '', tt = t.t;
      if (tt === '(' || tt === ')') mirror.push({text:tt, cls:'m-par' + e});
      else if (isOpTok(tt)) mirror.push({text:tt, cls:'m-op' + e});
      else {
        var off = 0;
        if (tt[0] === '-' && tt.length > 1) { mirror.push({text:'-', cls:'m-neg' + e}); off = 1; }
        var body = tt.slice(off), fm = /^([A-Za-z]+:)(.*)$/.exec(body);
        if (fm) { mirror.push({text:fm[1], cls:'m-field' + e}); if (fm[2]) mirror.push({text:fm[2], cls:(fm[2][0] === '"' ? 'm-phr' : 'm-val') + e}); }
        else mirror.push({text:body, cls:(body[0] === '"' ? 'm-phr' : 'm-txt') + e});
      }
      pos = t.end;
    });
    if (pos < q.length) mirror.push({text:q.slice(pos), cls:''});

    function ins(text, spaced){
      var s = self.state, qq = s.q, c = Math.min(s.caret, qq.length), before = qq.slice(0, c), after = qq.slice(c);
      var pre = (spaced && before && !/\s$/.test(before)) ? ' ' : '';
      var post = spaced ? ' ' : '';
      var nq = before + pre + text + post + after;
      set({q:nq, caret:(before + pre + text + post).length});
    }
    var acc = [
      {label:'(', t:'(', sp:false, cls:'acc', aria:'Insert opening parenthesis'},
      {label:')', t:')', sp:false, cls:'acc', aria:'Insert closing parenthesis'},
      {label:'"', t:'"', sp:false, cls:'acc', aria:'Insert quote'},
      {label:'OR', t:'OR', sp:true, cls:'acc op', aria:'Insert OR'},
      {label:'AND', t:'AND', sp:true, cls:'acc op', aria:'Insert AND'},
      {label:'NOT', t:'-', sp:false, cls:'acc op', aria:'Exclude next term'},
      {label:'applies:', t:'applies:', sp:false, cls:'acc fd', aria:'Insert applies field'},
      {label:'uses:', t:'uses:', sp:false, cls:'acc fd', aria:'Insert uses field'},
      {label:'class:', t:'class:', sp:false, cls:'acc fd', aria:'Insert class field'},
      {label:'mat:yes', t:'mat:yes', sp:true, cls:'acc fd', aria:'Insert artifact-eligible filter'}
    ].map(function(b){ return {label:b.label, cls:b.cls, aria:b.aria, go:function(){ ins(b.t, b.sp); }}; });

    var ast = parseTokens(tokenize(q));
    return {
      q:q, hasQ:q.length > 0,
      onInput:function(e){ set({q:e.target.value, caret:e.target.selectionStart}); },
      onSel:function(e){ var c = e.target.selectionStart; if (c !== self.state.caret) set({caret:c}); },
      clearQ:function(){ set({q:'', caret:0}); },
      mirror:mirror, barBorder: nErr ? '#8a4a40' : '#4a76b0', hasErrors:nErr > 0,
      hasDiag:!!d0, diagMsg: d0 ? d0.msg + (diagsRaw.length > 1 ? '  (+' + (diagsRaw.length - 1) + ' more)' : '') : '',
      diagHasFix: !!(d0 && d0.fix), diagFixLabel: d0 ? d0.fixLabel : '',
      diagFix:function(){ if (d0 && d0.fix) set({q:d0.fix, caret:d0.fix.length}); },
      diagBg: warn ? '#2a2412' : '#2a1816', diagBorder: warn ? '#5a4a22' : '#6e3a33', diagColor: warn ? '#f6dc9a' : '#ffc9bf',
      reads:explain(ast),
      showHistory:showHistory, showSuggest:!showHistory,
      items:itemsV, acc:acc,
      count:ast ? ROWS.filter(function(r){ return evalNode(ast, r); }).length : ROWS.length
    };
  }
}
</script>
</body>
