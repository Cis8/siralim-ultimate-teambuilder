# Hand-made corrections to what the extractor guesses (SPEC §4, ADR-0006).
#
# Every entry names a trait by its id (the `id` in the dataset, e.g. `abomination--flesh-rot`) and says in `reason`
# why it is here, citing the wording of the trait. The build fails when an entry names a trait or a mention that no
# longer exists, and warns when an entry changes nothing: then delete it. Put a `reason` that contains a colon or
# quotes between single quotes, as below.
#
# roles: who gives a buff, debuff or effect and who relies on it, what an event does (causes it: applies, pays off: uses,
# prevents it: resists) and who does it, where the wording fooled the heuristic.
#   - trait: sandstorm            # trait id
#     keyword: blind              # key of a buff, debuff, effect or event in the taxonomy
#     occurrence: 2               # optional: which mention in the trait, counting from 1; leave out for all of them
#     role: uses                  # applies | uses | resists; leave out to correct only the actor
#     actor: enemy                # events only: self | ally | enemy | any; leave out to correct only the role
#     reason: 'Sandstorm, second sentence: "your creatures with Blind" only reads the debuff.'
#
# randomDebuff: who a "random debuff" trait afflicts, and whether it can do so on its own (GAME_RULES R5).
#   - trait: grim-ailment
#     target: enemy               # enemy | self_or_allies | both
#     activation: conditional     # unconditional | conditional
#     note: After your creatures apply a debuff    # optional: what a conditional source waits for
#     reason: Grim Ailment only adds a random debuff after another one was applied.

# Read by hand on 2026-10-16, mention by mention, for the 38 buffs and debuffs of compendium v2.0 (M3.7). What is left
# here is what the wording of the heuristic cannot tell apart.
roles:
  # The Barrier named again is the one already there, not a new one.
  - trait: koloss--heart-versus-mind
    keyword: barrier
    occurrence: 2
    role: uses
    reason: 'Heart versus Mind: "the original strength of the Barrier as Maximum health" refers to the Barrier that was destroyed.'
  - trait: koloss--trauma-prevention
    keyword: barrier
    occurrence: 2
    role: uses
    reason: 'Trauma Prevention: "the strength of the Barrier is increased" refers to the Barrier the creatures just gained.'

  # Waits for the debuff instead of applying it.
  - trait: pilwiz--marked-for-death
    keyword: bleeding
    role: uses
    reason: 'Marked for Death attacks each enemy "that is afflicted with Bleeding": it needs the debuff to be there.'

  # Gives itself the buff under a condition, in words ("it is", "has") that the heuristic reads as a check.
  - trait: sanctus--chastity
    keyword: invisible
    role: applies
    reason: 'Chastity: "While this creature has more than 90% health, it is Invisible" grants Invisible.'
  - trait: storm--cloud-connected
    keyword: repelling
    role: applies
    reason: 'Cloud Connected: "While this creature is above 90% health, it has Repelling" grants Repelling.'
  - trait: kraken--inky-escape
    keyword: agile
    role: applies
    reason: 'Inky Escape: "As long as this creature hasn''t gained or lost speed, it has 200% more speed and has Agile" grants Agile.'
  - trait: kraken--iron-shell
    keyword: protected
    role: applies
    reason: 'Iron Shell: "As long as this creature hasn''t gained or lost defense, it has 200% more defense and has Protected" grants Protected.'
  - trait: kraken--unblinking-eyes
    keyword: arcane
    role: applies
    reason: 'Unblinking Eyes: "As long as this creature hasn''t gained or lost intelligence, it has 200% more intelligence and has Arcane" grants Arcane.'
  - trait: kraken--shipbreaker
    keyword: berserk
    role: applies
    reason: 'Shipbreaker: "As long as this creature hasn''t gained or lost attack, it has 200% more attack and has Berserk" grants Berserk.'
  - trait: minotaur--seeing-red
    keyword: berserk
    role: applies
    reason: 'Seeing Red: "While your creatures are below 80% health, they have Berserk" grants Berserk.'
  - trait: wight--master-of-wights
    keyword: shelled
    role: applies
    reason: 'Master of Wights: Wights "always resurrect with 100% Health and Shelled", so the mastery gives Shelled.'

  # Events (GAME_RULES R12, ADR-0009). Read on 2026-10-17 beside the sweep of 8b.5: every mention where the role or the actor
  # differs from what the sweep recorded was looked at, and what is here is where the wording fooled the heuristic. The
  # sweep calls "modifier" what the rules call causing or improving, so a difference of that kind is not a mistake.
  - trait: backer--impatience
    keyword: start of turn
    role: applies
    actor: any
    reason: 'Impatience: "this creature and a random enemy activate their start-of-turn and end-of-turn effects" makes those effects happen, for both creatures.'
  - trait: backer--impatience
    keyword: end of turn
    role: applies
    actor: any
    reason: 'Impatience: "this creature and a random enemy activate their start-of-turn and end-of-turn effects" makes those effects happen, for both creatures.'
  - trait: exotic--the-end-of-all-things
    keyword: end of turn
    occurrence: 2
    role: applies
    reason: 'The End of All Things: "adjacent creatures activate their end-of-turn effects" makes those effects happen.'
  - trait: griffon--master-of-griffons
    keyword: attack
    role: applies
    reason: 'Master of Griffons: "on-attack and on-critical effects occur 1 additional time" makes those effects happen again.'
  - trait: asura--master-of-asuras
    keyword: critical hit
    role: applies
    reason: 'Master of Asuras: "on-critical effects activate 2 additional times" makes those effects happen again.'
  - trait: hemomancer--master-of-hemomancers
    keyword: attack
    role: applies
    reason: 'Master of Hemomancers: "on-attack and when-attacked effects activate 1 additional time" makes those effects happen again.'
  - trait: backer--death-threats
    keyword: dodge
    role: applies
    actor: enemy
    reason: 'Death Threats: "3 random enemies activate their on-dodge effects" makes the enemies'' effects happen.'
  - trait: underdweller--mortal-terror
    keyword: death
    role: applies
    reason: 'Mortal Terror: "activates that enemy''s on-death effects" makes those effects happen.'
  - trait: smith--iannes-quirk
    keyword: cast spell
    role: applies
    reason: 'Ianne''s Quirk: "After this creature attacks it casts Metamorphosis" has no comma, so the cast was read as part of the condition.'
  - trait: construct--chaos-through-creation
    keyword: attack
    role: uses
    reason: 'Chaos through Creation: "Afer this creature attacks, it casts …" has a typo that hides the condition.'
  - trait: slime--dispersion
    keyword: heal
    occurrence: 1
    role: applies
    reason: 'Dispersion: "your other creatures that don''t have this trait are healed for 50% of the amount": the trait heals them.'
  - trait: exotic--projection
    keyword: defend
    role: uses
    reason: 'Projection: "After an adjacent ally attacks, casts a spell, defends, or provokes" is one list: all of it is the condition.'
  - trait: exotic--projection
    keyword: provoke
    role: uses
    reason: 'Projection: "After an adjacent ally attacks, casts a spell, defends, or provokes" is one list: all of it is the condition.'
  - trait: marionette--hoodwink
    keyword: provoke
    role: uses
    actor: ally
    reason: 'Hoodwink: "target provoking allies" describes the allies the enemies choose, it does not make them provoke.'
  - trait: marionette--hoodwink
    keyword: attack
    actor: enemy
    reason: 'Hoodwink: "Enemies with Blind … target provoking allies with attacks": the enemies attack.'
  - trait: backer--shrapnel-blast
    keyword: start of turn
    actor: enemy
    reason: 'Shrapnel Blast: "After an enemy takes damage at the start of its turn from Bomb": its turn is the enemy''s.'
  - trait: concoction--master-of-concoctions
    keyword: start of turn
    actor: ally
    reason: 'Master of Concoctions: "they have a 50% chance to attack each enemy … at the start of their turns": their turns are those of the Concoctions.'
  - trait: mummy--pharaohs-beckoning
    keyword: attack
    occurrence: 3
    actor: enemy
    reason: 'Pharaoh''s Beckoning: "the target is forced to attack this creature 3 times. These attacks …" are the target''s.'
  - trait: cruncher--shellshock
    keyword: provoke
    actor: self
    reason: 'Shellshock: "After this creature is attacked, it Seals … and provokes": it is this creature, not the target.'
  - trait: hunter--glaive-of-justice
    keyword: cast spell
    actor: self
    reason: 'Glaive of Justice: "it deals damage to a random enemy … and has a 50% chance to cast Holy Smite": it is this creature.'
  - trait: hunter--glaive-of-hungering
    keyword: heal
    actor: self
    reason: 'Glaive of Hungering: "it … heals itself for 100% of this damage": this creature heals itself.'
  - trait: hunter--glaive-of-prayer
    keyword: resurrection
    actor: self
    reason: 'Glaive of Prayer: "it … has a 20% chance to resurrect a random ally": this creature resurrects.'

randomDebuff: []
