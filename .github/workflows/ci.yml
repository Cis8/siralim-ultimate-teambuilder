name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    # The e2e step alone takes 16 to 19 minutes on this runner (about 4.5 minutes on a developer machine), and grows with every slice.
    timeout-minutes: 30
    env:
      # Build and e2e run under the same base path GitHub Pages serves the app from.
      BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size-budget
      - name: Install Playwright browsers
        run: pnpm --filter @atlas/web exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No BASE_PATH: Lighthouse CI serves the build from the root of its own server.
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The Chromium the e2e uses (lighthouserc.cjs asks Playwright where it is).
      - name: Install Chromium
        run: pnpm --filter @atlas/web exec playwright install --with-deps chromium
      - name: Lighthouse CI
        shell: bash # with pipefail, so that a failure of lhci is not hidden by tee
        run: pnpm lighthouse 2>&1 | tee lighthouse.log
      # What went wrong, in the summary of the run: the log itself takes a sign-in to read.
      - name: Say what Lighthouse reported
        if: failure()
        shell: bash
        run: echo "::error title=Lighthouse CI::$(tail -n 40 lighthouse.log | sed ':a;N;$!ba;s/\n/%0A/g')"
      - name: Upload Lighthouse reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: apps/web/.lighthouseci
          include-hidden-files: true
          retention-days: 7
